; Compile-only reference target for the UART0 responder.
; This is not identification or upload approval for the physical camera PCB.
[platformio]
src_dir = SentinelCameraProbe

[env:reference_esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
