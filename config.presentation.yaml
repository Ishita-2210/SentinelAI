# Official presentation: laptop webcam; experimental ESP32 gates remain intact.
camera:
  source: 0
detector:
  model_path: yolo11n.pt
  confidence_threshold: 0.5
  iou_threshold: 0.7
vlm:
  enabled: true
  event_types:
  - PERSON_ENTERED
  - LOITERING
  - UNATTENDED_OBJECT
llm:
  enabled: true
  model_id: HuggingFaceTB/SmolLM2-135M-Instruct
esp32:
  enabled: false
  mode: serial
  serial_port: null
  baudrate: 115200
database:
  path: data/presentation/sentinelai.db
evidence:
  output_dir: data/presentation/events
api:
  host: 127.0.0.1
  port: 8010
